<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="FreeCAD Agent logo">
  <defs>
    <linearGradient id="fa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="fa-gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- app-icon badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fa-bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- gear (CAD / mechanical) -->
  <g fill="url(#fa-gear)">
    <!-- 10 teeth -->
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(0 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(36 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(72 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(108 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(144 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(180 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(216 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(252 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(288 128 128)"/>
    <rect x="118" y="36" width="20" height="34" rx="5" transform="rotate(324 128 128)"/>
    <circle cx="128" cy="128" r="62"/>
  </g>

  <!-- centre cap -->
  <circle cx="128" cy="128" r="22" fill="#0b3d52"/>
  <!-- spark (AI / intelligence) -->
  <polygon points="128,112 122.5,122.5 112,128 122.5,133.5 128,144 133.5,133.5 144,128 133.5,122.5" fill="#fbbf24"/>
</svg>
