<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="1020" height="420" role="img" aria-label="FreeCAD Agent architecture pipeline">
  <defs>
    <linearGradient id="diag-box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <marker id="diag-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1020" height="420" fill="#ffffff"/>

  <text x="40" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">How it works</text>

  <!-- pipeline boxes -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="120" width="156" height="64" rx="12" fill="url(#diag-box)"/>
      <text x="118" y="147" font-size="16" font-weight="700" fill="#ffffff">You</text>
      <text x="118" y="166" font-size="11.5" fill="#e2e8f0">natural-language prompt</text>
    </g>
    <g>
      <rect x="236" y="120" width="156" height="64" rx="12" fill="url(#diag-box)"/>
      <text x="314" y="147" font-size="16" font-weight="700" fill="#ffffff">Perception</text>
      <text x="314" y="166" font-size="11.5" fill="#e2e8f0">documentOverview · objectDetail</text>
    </g>
    <g>
      <rect x="432" y="120" width="156" height="64" rx="12" fill="url(#diag-box)"/>
      <text x="510" y="145" font-size="15" font-weight="700" fill="#ffffff">Planner &amp; Validator</text>
      <text x="510" y="165" font-size="11.5" fill="#e2e8f0">orders + validates</text>
    </g>
    <g>
      <rect x="628" y="120" width="156" height="64" rx="12" fill="url(#diag-box)"/>
      <text x="706" y="147" font-size="16" font-weight="700" fill="#ffffff">Executor</text>
      <text x="706" y="166" font-size="11.5" fill="#e2e8f0">FreeCAD · undoable txns</text>
    </g>
    <g>
      <rect x="824" y="120" width="156" height="64" rx="12" fill="url(#diag-box)"/>
      <text x="902" y="147" font-size="15" font-weight="700" fill="#ffffff">Verify &amp; Render</text>
      <text x="902" y="166" font-size="11.5" fill="#e2e8f0">geometry check · panel</text>
    </g>
  </g>

  <!-- forward arrows -->
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="196" y1="152" x2="230" y2="152" marker-end="url(#diag-arrow)"/>
    <line x1="392" y1="152" x2="426" y2="152" marker-end="url(#diag-arrow)"/>
    <line x1="588" y1="152" x2="622" y2="152" marker-end="url(#diag-arrow)"/>
    <line x1="784" y1="152" x2="818" y2="152" marker-end="url(#diag-arrow)"/>
  </g>

  <!-- repair loop (bounded replan) -->
  <path d="M902,184 L902,268 L588,268 L586,186" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#diag-arrow)"/>
  <text x="745" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b45309" text-anchor="middle" font-style="italic">repair · bounded (≤3) replan</text>

  <!-- inference band -->
  <rect x="40" y="316" width="940" height="46" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    Inference: local LLM via Ollama (default <tspan font-weight="700" fill="#0f172a">qwen3:4b</tspan>) · any OpenAI-compatible provider drives Perception, Planning and repair
  </text>
</svg>
